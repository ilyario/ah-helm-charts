apiVersion: v2
name: static-proxy
description: A Helm chart for deploying an NGINX-based reverse proxy to external and internal resources (Ingress/HTTPRoute, Service, HPA)
type: application
version: 0.1.2
appVersion: "1.16.0"
kubeVersion: ">=1.23.0-0"
home: https://github.com/ilyario/ah-helm-charts
sources:
  - https://github.com/ilyario/ah-helm-charts
maintainers:
  - name: Ilya Ponomarev
    email: ponomarevid@ya.ru
keywords:
  - nginx
  - proxy
  - reverse-proxy
  - s3
  - static
icon: https://raw.githubusercontent.com/ilyario/ah-helm-charts/main/docs/assets/static-proxy-icon.svg
annotations:
  category: Infrastructure
  licenses: MIT
  artifacthub.io/links: |
    - name: source
      url: https://github.com/ilyario/ah-helm-charts
    - name: support
      url: https://github.com/ilyario/ah-helm-charts/issues
  artifacthub.io/changes: |
    - kind: added
      description: kubeVersion, keywords, icon and artifacthub.io annotations
