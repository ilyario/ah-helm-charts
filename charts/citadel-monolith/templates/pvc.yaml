{{ $common := .Values.common }}
{{- if $common.sharedPVCs }}
{{- range $common.sharedPVCs }}
{{- $annotations := mergeOverwrite (dict "helm.sh/resource-policy" "keep") (default (dict) .annotations) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "citadel-common.fullname" $ }}-{{ include "citadel-common.dnsLabel" .name }}
  labels:
    {{- include "citadel-common.labels" $ | nindent 4 }}
  annotations:
    {{- range $key := keys $annotations }}
    {{ $key | quote }}: {{ index $annotations $key | toString | quote }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .accessModes | nindent 4 }}
  {{- if .storageClass }}
  storageClassName: {{ .storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .size }}
{{- end }}
{{- end }}
