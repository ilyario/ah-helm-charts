{{- range .Values.applications }}
{{- if .service }}
{{- $appSafe := include "citadel-common.dnsLabel" .name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "citadel-common.fullname" $ }}-{{ $appSafe }}
  labels:
    {{- include "citadel-common.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $appSafe }}
    component: {{ $appSafe }}
spec:
  type: {{ .service.type | default "ClusterIP" }}
  ports:
    - port: {{ .service.port }}
      targetPort: http-{{ $appSafe }}
      protocol: TCP
      name: http-{{ $appSafe }}
  selector:
    {{- include "citadel-common.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $appSafe }}
    component: {{ $appSafe }}
{{- end }}
{{- end }}

