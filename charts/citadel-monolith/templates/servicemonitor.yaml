{{- range .Values.applications }}
{{- if and .service .serviceMonitor (and .serviceMonitor .serviceMonitor.enabled) }}
{{- $appSafe := include "citadel-common.dnsLabel" .name }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "citadel-common.fullname" $ }}-{{ $appSafe }}
  labels:
    {{- include "citadel-common.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $appSafe }}
    component: {{ $appSafe }}
    {{- with .serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  selector:
    matchLabels:
      {{- include "citadel-common.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $appSafe }}
      component: {{ $appSafe }}
  endpoints:
    - port: {{ default (printf "http-%s" $appSafe) .serviceMonitor.portName }}
      path: {{ required (printf "applications.%s: serviceMonitor.path is required" .name) .serviceMonitor.path }}
      interval: {{ required (printf "applications.%s: serviceMonitor.interval is required" .name) .serviceMonitor.interval }}
      scrapeTimeout: {{ required (printf "applications.%s: serviceMonitor.scrapeTimeout is required" .name) .serviceMonitor.scrapeTimeout }}
      {{- with .serviceMonitor.honorLabels }}
      honorLabels: {{ . }}
      {{- end }}
      {{- with .serviceMonitor.honorTimestamps }}
      honorTimestamps: {{ . }}
      {{- end }}
      {{- with .serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .serviceMonitor.basicAuth }}
      basicAuth:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .serviceMonitor.bearerTokenSecret }}
      bearerTokenSecret:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .serviceMonitor.scheme }}
      scheme: {{ . }}
      {{- end }}
      {{- with .serviceMonitor.tlsConfig }}
      tlsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
