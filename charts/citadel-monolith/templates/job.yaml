{{ $common := .Values.common }}
{{- range $job := .Values.jobs }}
{{- if $job.enabled }}
{{- $jobSafe := include "citadel-common.dnsLabel" .name }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "citadel-common.fullname" $ }}-job-{{ $jobSafe }}
  labels:
    {{- include "citadel-common.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
  annotations:
    "helm.sh/hook": {{ default "pre-install,pre-upgrade" $job.helmHook }}
    "helm.sh/hook-delete-policy": {{ default "before-hook-creation,hook-succeeded" $job.helmHookDeletePolicy }}
    "helm.sh/hook-weight": {{ $job.hookWeight | default "15" | quote }}
spec:
  {{- with $job.backoffLimit }}
  backoffLimit: {{ . }}
  {{- end }}
  {{- with $job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  template:
    metadata:
      {{- with $job.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "citadel-common.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ .name }}
    spec:
      restartPolicy: Never
      {{- if or $job.imagePullSecrets $common.imagePullSecrets }}
      imagePullSecrets:
        {{- with $job.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $common.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      serviceAccountName: {{ include "citadel-common.serviceAccountName" $ }}
      {{- with $job.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $.Chart.Name }}-{{ $jobSafe }}
          {{- with $job.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{ if or $common.env $job.env  }}
          env:
            {{- with $common.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $job.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if $job.image }}
          image: {{ include "citadel-common.image" (dict "repository" $job.image.repository "tag" $job.image.tag "commonRepository" $common.image.repository "commonTag" $common.image.tag "path" (printf "jobs[%s]" $jobSafe)) | quote }}
          imagePullPolicy: {{ default $common.image.pullPolicy $job.image.pullPolicy }}
          {{- else }}
          image: {{ include "citadel-common.image" (dict "commonRepository" $common.image.repository "commonTag" $common.image.tag "path" "common.image") | quote }}
          imagePullPolicy: {{ $common.image.pullPolicy }}
          {{- end }}
          {{- with $job.command }}
          command: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $job.args }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $common.infisical.enabled $common.sharedSecrets }}
          envFrom:
            {{- if $common.infisical.enabled }}
            - secretRef:
                name: {{ include "citadel-common.fullname" $ }}-common-env-vars
            {{- end }}
            {{- if $common.sharedSecrets }}
            {{- range $common.sharedSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- with $job.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $common.sharedPVCs }}
          volumeMounts:
            {{- range $common.sharedPVCs }}
            - name: {{ include "citadel-common.dnsLabel" .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
          {{- end }}
      {{- with $common.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $common.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $common.sharedPVCs }}
      volumes:
        {{- range $common.sharedPVCs }}
        - name: {{ include "citadel-common.dnsLabel" .name }}
          persistentVolumeClaim:
            claimName: {{ include "citadel-common.fullname" $ }}-{{ include "citadel-common.dnsLabel" .name }}
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
