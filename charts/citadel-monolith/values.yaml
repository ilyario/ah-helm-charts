# -- Secret refs for private registries, e.g. `[{name: regcred}]`
imagePullSecrets: []
# -- Short chart name override (defaults to chart name)
nameOverride: ""
# -- Full resource name override (defaults to release+chart name)
fullnameOverride: ""

# -- Service account for the rendered resources
serviceAccount:
  # -- Create a ServiceAccount and attach it to rendered workloads
  create: false
  # -- Automatically mount the ServiceAccount token inside pods
  automount: true
  annotations: {}
  # -- ServiceAccount name (defaults to <fullname>)
  name: ""

# -- Shared settings for all applications (scheduling, env, storage, secrets, image, gateway)
common:
  grafana:
    # Опционально: ConfigMap с Grafana dashboard (SRE) для sidecar kube-prometheus-stack
    # Включите common.grafana.dashboard.enabled: true — в namespace релиза появится ConfigMap;
    # sidecar Grafana (label grafana_dashboard) подхватит JSON. Требуется kube-prometheus-stack
    # (или аналог) с Prometheus, kube-state-metrics и метриками ingress-nginx при использовании
    # панелей nginx_ingress_controller_*.
    dashboard:
      # -- Render the SRE Grafana dashboard ConfigMap (kube-prometheus-stack sidecar picks it up)
      enabled: false
      # Имя ConfigMap (по умолчанию: <release>-sre-dashboard)
      name: ""
      # Метки для sidecar grafana-sc-dashboard (kube-prometheus-stack): grafana_dashboard: "1"
      labels:
        grafana_dashboard: "1"
      annotations: {}

  # -- Default container image for applications/jobs/cronjobs without their own image
  image:
    # -- Registry/repo of the default image
    repository: nginx
    # -- Kubernetes pull policy for the default image
    pullPolicy: IfNotPresent
    # -- Required: rendering fails when the effective tag is empty
    tag: ""
  # -- Logical environment (dev/staging/prod), used in labels/annotations
  environment: dev
  # -- Node selector applied to all application pods
  nodeSelector: {}
  # -- Tolerations applied to all application pods
  tolerations: []
  # -- Node affinity applied to all application pods
  affinity: {}
  # -- Registry pull secrets for the default image
  imagePullSecrets: []
    # - name: regcred
  # -- PVCs provisioned in the release namespace and mounted into every application pod. Per-item `annotations` are merged onto the claim; `helm.sh/resource-policy=keep` is the default so uninstall does not delete the volume. Set `helm.sh/hook` on a claim that was created as a Helm hook so upgrade does not try to adopt it.
  sharedPVCs: []
    # - name: static-storage
    #   mountPath: /static
    #   storageClass: csi-s3
    #   size: 10Gi
    #   accessModes:
    #     - ReadWriteMany
    #   annotations:
    #     helm.sh/hook: pre-install
    #     helm.sh/hook-weight: "-5"
  # -- Pre-existing Secrets mounted into every application pod
  sharedSecrets: []
    # - my-secret-name
    # - another-secret-name

  # -- Extra environment variables for every application container
  env: []
    # - name: TZ
    #   value: Asia/Irkutsk
  # -- Pod topology spread constraints for all application pods
  # -- (labelSelector.matchLabels.component is templated per application)
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          component: ""
  # -- Infisical ExternalSecret sync (requires the Infisical operator CRDs)
  infisical:
    enabled: false
    # -- Infisical API URL
    url: http://infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
    # -- External Secrets resync interval in seconds
    resyncInterval: 10
    # -- Shared secret store for all applications in the release
    commonSecret:
      enabled: false
      # -- Infisical project slug to sync secrets from
      projectSlug: ""
      secretsPath: /
      credentialsRef:
        secretName: client-infisical-secrets
  # -- Ingress class for per-application Ingress resources
  ingress:
    className: nginx
  # -- Default Gateway API parentRefs for per-application HTTPRoutes
  # -- Cluster-scoped Gateway/GatewayClass live elsewhere; the chart only renders HTTPRoutes
  gatewayApi:
    parentRefs: []
    #  - name: my-gateway
    #    namespace: istio-system
    #    group: gateway.networking.k8s.io
    #    kind: Gateway

# -- CronJobs with schedule/timeZone/concurrency policy and history limits; empty image tag fails rendering
cronjobs: []
  # - name: backup
  #   enabled: false
  #   schedule: "0 2 * * *"  # Каждый день в 2:00
  #   timeZone: "UTC"
